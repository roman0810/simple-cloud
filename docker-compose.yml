services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # "db" - это имя сервиса ниже; внутри сети compose контейнеры находят друг друга по имени
      DATABASE_URL: postgresql://cloudbox:cloudbox@db:5432/cloudbox
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy  # ждём пока БД реально готова принимать подключения
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Воркеры берут задачи из очереди redis. Число регулируется:
  #   docker compose up --scale worker=4
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      disable: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:17-alpine  # готовый образ с Docker Hub
    environment:
      # при первом запуске postgres создаст пользователя и базу с этими именами
      POSTGRES_USER: cloudbox
      POSTGRES_PASSWORD: cloudbox
      POSTGRES_DB: cloudbox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbox -d cloudbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
